<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campamento VPPP · Plano</title>
<style>

n(510px,92vw);padding:24px;color:inherit;box-shadow:0 20px 70px #10264155}dialog::backdrop{background:#10264170}.bed{border-top:1px solid #dbe3ed;padding:8px 0;line-height:1.3}.bed p{margin:3px 0}.action{border:0;border-radius:8px;background:#174e85;color:white;padding:9px 14px;font:inherit;cursor:pointer}.close{float:right;background:#e7edf5;color:#172b43}form{display:grid;gap:10px;margin-top:12px}#msg{min-height:1em}@media(max-width:620px){.floor{grid-template-columns:1fr}h1{font-size:30px}}
.other-company{background:#E3E8EF;border-color:#aab8c9}
.remove-guest{display:inline-grid;place-items:center;width:36px;height:36px;margin-left:8px;vertical-align:middle;border:1px solid #e9b1b1;border-radius:8px;background:#fff;color:#b42318;cursor:pointer}
.remove-guest svg{width:18px;height:18px}
.remove-guest:hover{background:#fff1f0}
.remove-guest:disabled{opacity:.55;cursor:wait}
.filters .module-only{display:flex;align-items:center;align-self:end;min-height:40px}
.checkbox-row{display:flex;align-items:center}.checkbox-row input,.filters .module-only input{min-height:0;accent-color:#174e85}
.room.company-match{border-color:#174e85;box-shadow:inset 0 0 0 1px #174e85}
.room.person-match{background:#dbeafe;border-color:#1d4ed8;box-shadow:inset 0 0 0 2px #1d4ed8}
.person-match-label{color:#1e3a8a;font-weight:750}
</style>
<header><strong>Campamento VPPP</strong><a href="Campamento_VPPP_Login.html" style="color:white">Volver al menú</a></header><main>
<h1>Consulta y asignación de camas</h1><p>Selecciona una habitación en el plano para consultar sus camas.</p>
<p id="romlistDate" hidden></p>
<div class="filters"><label>Empresa<select id="company"><option value="">Todas las empresas</option></select></label><label>Tipo de piso<select id="type"><option value="">Todos los tipos</option><option>WORKER</option><option>STAFF</option><option>MIXTO</option><option>MANAGER</option></select></label><label>Buscar módulo<input id="moduleSearch" type="search" placeholder="Ej. SD"></label><label>Buscar persona<input id="personSearch" type="search" placeholder="DNI o nombre" autocomplete="off"></label><label class="module-only"><input id="companyModulesOnly" type="checkbox" disabled>Solo módulos de la empresa seleccionada</label><label class="module-only"><input id="femaleOnly" type="checkbox">Habitaciones femeninas o vacías</label></div>
<div class="legend"><span class="free">Libre</span><span class="partial">Ocupación parcial</span><span class="full">Completa</span><span class="other-company">No corresponde a la empresa filtrada</span></div>
<section id="map" aria-label="Plano de habitaciones"></section><p id="msg" role="status"></p></main>
<dialog id="detail"><button class="action close" id="close">Cerrar</button><h2 id="roomTitle"></h2><p id="roomCompany" class="company"></p><section id="beds"></section><form id="entry" hidden></form><p id="feedback" role="status"></p></dialog>
<style>[hidden]{display:none!important}</style>
<script src="Campamento_VPPP_Conexion.js"></script>
<script>
const byId = id => document.getElementById(id);
let data;
let saving = false;
const key = (module, floor, room, bed) => JSON.stringify([module,floor,room,bed]);
const occupants = new Map();

function el(tag,text='',className=''){
 const node=document.createElement(tag);
 node.textContent=text;node.className=className;
 return node;
}

function roomBeds(floor,room){
 return Array.from({length:floor.beds},(_,i)=>{
  const number=i+1;
  return {
   number,
   company:floor.bedCompanies?.[room]?.[number]??floor.assignments[room]??'',
   occupant:occupants.get(key(floor.module,floor.number,room,number))
  };
 });
}

const availableForCompany=bed=>!bed.company&&!bed.occupant;

function matchesFemaleFilter(beds){
 const guests=beds.filter(bed=>bed.occupant);
 return guests.every(bed=>bed.occupant.sex==='F');
}

const normalizePersonText=value=>String(value??'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().trim();

function matchesPerson(person,terms){
 if(!person)return false;
 const name=normalizePersonText(person.name);
 const document=normalizePersonText(person.document);
 return terms.every(term=>name.includes(term)||document.includes(term));
}

function render(){
 const map=byId('map'),company=byId('company').value,type=byId('type').value;
 const moduleQuery=byId('moduleSearch').value.trim().toUpperCase();
 const personTerms=normalizePersonText(byId('personSearch').value).split(/\s+/).filter(Boolean);
 let personCount=0;
 const moduleOnly=byId('companyModulesOnly');
 moduleOnly.disabled=!company;
 map.replaceChildren();
 for(const floor of data.floors){
  if(type&&floor.type!==type)continue;
  if(!floor.module.toUpperCase().startsWith(moduleQuery))continue;
  const blockedRooms=new Set(floor.blocked);
  const eligibleRooms=Array.from({length:floor.rooms},(_,index)=>index+1)
   .filter(room=>!blockedRooms.has(room))
   .map(room=>({room,beds:roomBeds(floor,room)}));
  if(company&&!eligibleRooms.some(({beds})=>beds.some(bed=>bed.company===company||(!moduleOnly.checked&&availableForCompany(bed)))))continue;
  const femaleOnly=byId('femaleOnly').checked;
  const rooms=femaleOnly?eligibleRooms.filter(({beds})=>matchesFemaleFilter(beds)):eligibleRooms;
  const roomMatches=new Map();
  if(personTerms.length){
   for(const {room,beds} of rooms){
    const count=beds.filter(bed=>(!company||bed.company===company)&&matchesPerson(bed.occupant,personTerms)).length;
    if(count)roomMatches.set(room,count);
   }
   if(!roomMatches.size)continue;
  }
  const section=el('article','','floor'),plan=el('div','','plan');
  let firstMatch;
  for(const {room,beds} of rooms){
   const otherCompany=company&&!beds.some(bed=>bed.company===company||availableForCompany(bed));
   const count=beds.filter(bed=>bed.occupant).length;
   const state=otherCompany?'other-company':count===0?'free':count===beds.length?'full':'partial';
   const names=[...new Set(beds.map(bed=>bed.company).filter(Boolean))];
   const companyMatch=Boolean(company&&names.includes(company));
   const tile=el('button','','room '+state+(companyMatch?' company-match':''));
   tile.append(el('strong',String(room).padStart(2,'0')),
    el('small',names.length>1?'Empresas mixtas':names[0]||'Sin empresa',
     !names.length||companyMatch?'company':''),
    el('small',count+' de '+beds.length+' camas ocupadas'));
   const matchingPeople=roomMatches.get(room);
   if(matchingPeople){
    tile.classList.add('person-match');
    tile.append(el('small',matchingPeople===1?'1 coincidencia':matchingPeople+' coincidencias','person-match-label'));
    firstMatch??=tile;
    personCount+=matchingPeople;
   }
   if(companyMatch&&names.length>1){
    tile.append(el('small',company,'company'));
   }
   const unassigned=beds.filter(availableForCompany).length;
   if(unassigned&&names.length)tile.append(el('small',
    unassigned+(unassigned===1?' cama libre sin empresa':' camas libres sin empresa'),'company'));
   if(femaleOnly){
    tile.style.gridRow=(room-1)%2+1;
    tile.style.gridColumn=Math.ceil(room/2);
   }
   tile.onclick=()=>openRoom(floor,room);
   plan.append(tile);
  }
  if(!plan.childElementCount)continue;
  const freeBeds=rooms.flatMap(({beds})=>beds).filter(bed=>
   !bed.occupant&&(!company||!bed.company||bed.company===company)
  ).length;
  const floorInfo=el('p','Piso '+floor.number+' · '+floor.type+' · ');
  floorInfo.append(el('strong',freeBeds+(freeBeds===1?' cama libre':' camas libres')));
  section.append(el('h2','Módulo '+floor.module),floorInfo,plan);
  map.append(section);
  if(firstMatch){
   const tileBounds=firstMatch.getBoundingClientRect(),planBounds=plan.getBoundingClientRect();
   if(tileBounds.right>planBounds.right)plan.scrollLeft=tileBounds.left-planBounds.left-10;
  }
 }
 byId('msg').textContent=personTerms.length
  ?personCount===0?'No se encontraron personas con los filtros actuales.':personCount===1?'1 persona encontrada.':personCount+' personas encontradas.'
  :map.childElementCount?map.childElementCount+' pisos en la vista':'No hay pisos que coincidan con los filtros.';
}

function matchesCompany(bed){
 const company=byId('company').value;
 return !company||bed.company===company;
}

function openRoom(floor,room){
 const dialog=byId('detail'),list=byId('beds'),blocked=floor.blocked.includes(room);
 byId('roomTitle').textContent=floor.module+floor.number+'-'+String(room).padStart(2,'0');
 const roomLayout=roomBeds(floor,room);
 const guests=roomLayout.flatMap(bed=>bed.occupant?[bed.occupant]:[]);
 const sexes=new Set(guests.map(guest=>guest.sex));
 const roomSex=sexes.size===1?guests[0].sex:null;
 const pending=guests.length>0&&roomSex!=='F'&&roomSex!=='M';
 byId('roomCompany').textContent=blocked?'Habitación bloqueada':pending?'Revisa el sexo de los huéspedes en el RomList.':roomSex==='F'?'Habitación femenina':roomSex==='M'?'Habitación masculina':'';
 byId('feedback').textContent='';
 byId('entry').hidden=true;
 list.replaceChildren();
 for(const bed of roomLayout){
  const row=el('div','','bed'+(matchesCompany(bed)||availableForCompany(bed)?'':' other-company'));
  row.append(el('strong','Cama '+bed.number),el('p',bed.company||'Sin empresa configurada'));
  if(bed.occupant){
   const person=bed.occupant;
   row.append(el('p',person.name+' · Documento '+person.document),
    el('small',person.company+' · '+person.origin));
   if(!blocked&&matchesCompany(bed)){
    const remove=el('button','','remove-guest');
    remove.type='button';
    remove.title='Retirar empleado';
    remove.setAttribute('aria-label',remove.title);
    remove.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3m4 0-1 15H6L5 6m5 4v7m4-7v7"/></svg>';
    remove.onclick=()=>removeGuest(floor,room,bed,remove);
    row.append(remove);
   }
  }else if(!blocked&&bed.company&&matchesCompany(bed)&&pending){
   row.append(el('small','Completa el sexo de los huéspedes antes de asignar esta cama.'));
  }else if(!blocked&&bed.company&&matchesCompany(bed)){
   const button=el('button','Asignar trabajador','action');
   button.onclick=()=>showForm(floor,room,bed,roomSex);
   row.append(button);
  }else row.append(el('small',blocked?'Asignación bloqueada':availableForCompany(bed)?'Asigna una empresa en Configuración.':'No corresponde a la empresa filtrada.'));
  list.append(row);
 }
 if(!dialog.open)dialog.showModal();
}

async function removeGuest(floor,room,bed,button){
 if(saving||floor.blocked.includes(room)||!matchesCompany(bed))return;
 if(!confirm('¿Retirar a '+bed.occupant.name+' de la cama '+bed.number+'? Se conservará la empresa asignada.'))return;
 saving=button.disabled=true;
 byId('entry').hidden=true;
 try{
  await rpc('retirar_huesped',{
   codigo:floor.module,numero_piso:floor.number,numero_habitacion:room,
   numero_cama:bed.number,documento_esperado:bed.occupant.document
  });
  occupants.delete(key(floor.module,floor.number,room,bed.number));
  render();
  openRoom(floor,room);
  byId('feedback').textContent='Huésped retirado. La cama quedó libre.';
 }catch(error){byId('feedback').textContent=error.message;}
 finally{saving=button.disabled=false;}
}

function field(label,input){
 const wrapper=el('label',label);
 wrapper.append(input);
 return wrapper;
}

function showForm(floor,room,bed,roomSex){
 if(saving||floor.blocked.includes(room)||!bed.company||!matchesCompany(bed))return;
 const form=byId('entry'),dni=el('input'),name=el('input'),button=el('button','Guardar asignación','action');
 const female=el('input'),sexLabel=el('label','','checkbox-row');
 female.type='checkbox';
 female.checked=roomSex==='F';
 female.disabled=Boolean(roomSex);
 sexLabel.append(female,'Es Femenino');
 dni.required=name.required=true;
 form.replaceChildren(el('p','Cama '+bed.number+' · '+bed.company),
  field('Documento de identidad',dni),field('Nombre del trabajador',name),sexLabel,button);
 form.hidden=false;
 dni.focus();
 form.onsubmit=async event=>{
  event.preventDefault();
  if(saving||!matchesCompany(bed))return;
  saving=button.disabled=true;
  const sex=female.checked?'F':'M';
  try{
   await rpc('asignar_cama',{
    codigo:floor.module,numero_piso:floor.number,numero_habitacion:room,numero_cama:bed.number,
    dni:dni.value,nombre:name.value,empresa_esperada:bed.company,sexo_huesped:sex
   });
   occupants.set(key(floor.module,floor.number,room,bed.number),{
    name:name.value.trim(),document:dni.value.trim(),company:bed.company,origin:'Registro manual',sex
   });
   render();
   openRoom(floor,room);
   byId('feedback').textContent='Asignación guardada.';
  }catch(error){byId('feedback').textContent=error.message;}
  finally{saving=button.disabled=false;}
 };
}

async function load(){
 if(!currentSession()){endSession();return;}
 watchSession();
 byId('msg').textContent='Cargando el padrón…';
 try{
  data=await rpc('consultar_camas');
  const romlistDate=byId('romlistDate');
  const loadInfo=data.romlist_carga;
  const loadDate=loadInfo?.fecha?new Date(loadInfo.fecha):null;
  if(loadDate&&!Number.isNaN(loadDate.getTime())){
   const label=loadInfo.solo_inicial?'Carga inicial del RomList':'Última carga del RomList';
   const formatter=new Intl.DateTimeFormat('es-PE',{
    dateStyle:'short',timeStyle:'short',timeZone:'America/Lima'
   });
   romlistDate.textContent=label+': '+formatter.format(loadDate);
  }else{
   romlistDate.textContent='Fecha de carga del RomList no disponible.';
  }
  romlistDate.hidden=false;
  for(const person of data.occupants){
   occupants.set(key(person.module,person.floor,person.room,person.bed),person);
  }
  for(const company of data.companies)byId('company').add(new Option(company,company));
  render();
  byId('company').onchange=render;
  byId('type').onchange=render;
  byId('femaleOnly').onchange=render;
  byId('companyModulesOnly').onchange=render;
  byId('moduleSearch').addEventListener('input',render);
  byId('personSearch').addEventListener('input',render);
 }catch(error){byId('msg').textContent=error.message;}
}
byId('close').onclick=()=>{if(!saving)byId('detail').close();};
byId('detail').oncancel=event=>{if(saving)event.preventDefault();};
load();
</script></html>
